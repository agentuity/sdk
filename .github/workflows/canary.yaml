name: NPM Pack & Upload

on:
   push:
      branches:
         - main
   pull_request:

permissions:
   contents: read
   pull-requests: write

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   CI: true
   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
   AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
   AWS_ENDPOINT_URL_IAM: ${{ vars.AWS_ENDPOINT_URL_IAM }}
   AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
   pack-and-upload:
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 15
      name: Pack & Upload
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Pack and Upload
           id: pack
           run: bun scripts/canary.ts

         - name: Comment on PR
           if: github.event_name == 'pull_request'
           uses: actions/github-script@v7
           with:
              script: |
                 const version = '${{ steps.pack.outputs.prerelease_version }}';
                 const packagesJson = ${{ steps.pack.outputs.packages_json }};
                 const executablesJson = ${{ steps.pack.outputs.executables_json }};
                 const npmBaseUrl = `https://agentuity-sdk-objects.t3.storage.dev/npm/${version}`;
                 const binaryBaseUrl = `https://agentuity-sdk-objects.t3.storage.dev/binary/${version}`;

                 // Build packages table
                 let packagesTable = '| Package | Version | URL |\n| --- | --- | --- |\n';
                 for (const pkg of packagesJson) {
                   const url = `${npmBaseUrl}/${pkg.tarball}`;
                   packagesTable += `| \`${pkg.name}\` | \`${version}\` | ${url} |\n`;
                 }

                 // Build executables table
                 let executablesTable = '| Platform | Version | URL |\n| --- | --- | --- |\n';
                 for (const exe of executablesJson) {
                   const url = `${binaryBaseUrl}/${exe.filename}`;
                   executablesTable += `| \`${exe.platform}\` | \`${version}\` | ${url} |\n`;
                 }

                 // Build dependencies object with all packages
                 const deps = {};
                 for (const pkg of packagesJson) {
                   deps[pkg.name] = `${npmBaseUrl}/${pkg.tarball}`;
                 }
                 const depsJson = JSON.stringify({ dependencies: deps }, null, 2);

                 const body = `<!-- agentuity-canary-bot -->
                 ## 📦 Canary Packages Published
                 **version:** \`${version}\`

                 <details>
                 <summary>Packages</summary>

                 ${packagesTable}
                 </details>

                 <details>
                 <summary>Install</summary>

                 Add to your \`package.json\`:

                 \`\`\`json
                 ${depsJson}
                 \`\`\`

                 Or install directly:

                 \`\`\`bash
                 ${packagesJson.map(pkg => `bun add ${npmBaseUrl}/${pkg.tarball}`).join('\n')}
                 \`\`\`
                 </details>

                 <details>
                 <summary>CLI Executables</summary>

                 ${executablesTable}
                 </details>

                 <details>
                 <summary>Run Canary CLI</summary>

                 \`\`\`bash
                 agentuity canary ${version} [command] [...args]
                 \`\`\`
                 </details>
                 `;

                  // Find existing comment
                  const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                  });

                  const botComment = comments.find(c =>
                    c.body && c.body.includes('<!-- agentuity-canary-bot -->')
                  );

                  if (botComment) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: botComment.id,
                      body: body,
                    });
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: body,
                    });
                  }

   github-app-tests:
      needs: pack-and-upload
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 30
      name: GitHub App E2E Tests
      env:
         GH_TEST_ACC_USERNAME: ${{ secrets.GH_TEST_ACC_USERNAME }}
         GH_TEST_ACC_PASSWORD: ${{ secrets.GH_TEST_ACC_PASSWORD }}
         GH_TEST_ACC_TOKEN: ${{ secrets.GH_TEST_ACC_TOKEN }}
         GH_TEST_ACC_REPO: ${{ vars.GH_TEST_ACC_REPO }}
         GH_TEST_TARGET_ORG_ID: ${{ secrets.GH_TEST_TARGET_ORG_ID }}
         AGENTUITY_API_KEY: ${{ secrets.AGENTUITY_API_KEY }}
         AGENTUITY_API_URL: ${{ vars.AGENTUITY_API_URL || 'https://api-v1.agentuity.com' }}
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Install Playwright
           run: bunx playwright install chromium

         - name: Setup test credentials
           run: |
              # Generate CLI API key for authentication
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ vars.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV
              
              # Set user ID for CLI auth
              echo "AGENTUITY_USER_ID=${{ vars.AGENTUITY_USER_ID }}" >> $GITHUB_ENV
              
              # Write .env file to SDK root (where test's dotenv loads from)
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" > .env
              echo "AGENTUITY_USER_ID=${{ vars.AGENTUITY_USER_ID }}" >> .env
              echo "AGENTUITY_API_URL=${{ vars.AGENTUITY_API_URL }}" >> .env
              
              # Also write to test project dir
              TEST_PROJECT_DIR="apps/testing/${{ vars.GH_TEST_ACC_REPO }}"
              cp .env ${TEST_PROJECT_DIR}/.env

         - name: Run GitHub App E2E tests
           run: bunx playwright test --config=e2e/github-login.config.ts

         - name: Upload test results
           if: always()
           uses: actions/upload-artifact@v4
           with:
              name: github-app-test-results
              path: |
                 playwright-report/
                 test-results/
