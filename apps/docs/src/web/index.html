<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" type="image/x-icon" href="./public/favicon.ico" />
		<title>Agentuity SDK Explorer</title>
		<!-- Prevent flash of wrong theme -->
		<script>
			(function () {
				const stored = localStorage.getItem('theme-preference');
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
				if (isDark) document.documentElement.classList.add('dark');
			})();
		</script>
		<!-- Tailwind CSS v4 Play CDN - compiles in browser -->
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<!-- Enable class-based dark mode for Tailwind v4 -->
		<style type="text/tailwindcss">
			@custom-variant dark (&:where(.dark, .dark *));

			@theme {
				/* Agentuity brand cyan */
				--color-cyan-50: #e5ffff;
				--color-cyan-100: #ccffff;
				--color-cyan-200: #99ffff;
				--color-cyan-300: #66ffff;
				--color-cyan-400: #33ffff;
				--color-cyan-500: #00ffff;
				--color-cyan-600: #00cccc;
				--color-cyan-700: #009999;
				--color-cyan-800: #006666;
				--color-cyan-900: #003333;
				--color-cyan-950: #001919;

				--animate-ellipsis: ellipsis 1.5s steps(4, end) infinite;
			}

			@keyframes ellipsis {
				0% {
					content: '.';
				}
				25% {
					content: '..';
				}
				50% {
					content: '...';
				}
				75% {
					content: '';
				}
			}

			[data-loading='true'] {
				display: inline;
				white-space: nowrap;
			}

			[data-loading='true']::after {
				content: '.';
				display: inline;
				white-space: nowrap;
				animation: var(--animate-ellipsis);
			}

			/* Monaco editor line highlighting */
			.line-highlight-subtle {
				background-color: rgba(255, 255, 0, 0.1);
			}

			.line-highlight-important {
				background-color: rgba(0, 255, 255, 0.15);
			}

			/* Dark mode variants */
			.dark .line-highlight-subtle {
				background-color: rgba(255, 255, 0, 0.08);
			}

			.dark .line-highlight-important {
				background-color: rgba(0, 255, 255, 0.12);
			}
		</style>
		<script type="module" src="./frontend.tsx" async></script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
