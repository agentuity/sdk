name: Test Install Script

on:
   push:
      branches:
         - main
      paths:
         - 'install.sh'
         - 'scripts/test-install.sh'
         - 'scripts/test-bun-check.sh'
         - 'packages/cli/**'
         - '.github/workflows/test-install.yaml'
   pull_request:
      paths:
         - 'install.sh'
         - 'scripts/test-install.sh'
         - 'scripts/test-bun-check.sh'
         - '.github/workflows/test-install.yaml'

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   CI: true

jobs:
   # Test on native macOS and Linux runners
   test-native:
      name: Test on ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      timeout-minutes: 10
      strategy:
         fail-fast: false
         matrix:
            os:
               - ubuntu-latest
               - ubuntu-22.04
               - macos-latest
               - macos-14
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2
           with:
              bun-version: latest

         - name: Test install script
           run: |
              set -e

              # Create temporary directory for installation
              tmpdir=$(mktemp -d)
              export HOME="$tmpdir"

              # Ensure bun is available in the temp HOME
              mkdir -p "$HOME/.bun/bin"
              ln -s "$(which bun)" "$HOME/.bun/bin/bun"
              export PATH="$HOME/.bun/bin:$PATH"

              # Run install script in non-interactive mode
              ./install.sh -y

              # Verify installation via bun global
              if [ ! -f "$HOME/.bun/bin/agentuity" ]; then
                echo "❌ CLI not installed at $HOME/.bun/bin/agentuity"
                ls -la "$HOME/.bun/bin/" || true
                exit 1
              fi

              # Test CLI execution
              "$HOME/.bun/bin/agentuity" --version

              # Cleanup
              rm -rf "$tmpdir"

              echo "✅ Install test passed on ${{ matrix.os }}"

   # Test on various Linux distributions using Docker
   test-linux-distros:
      name: Test on ${{ matrix.distro.name }}
      runs-on: ubuntu-latest
      timeout-minutes: 15
      strategy:
         fail-fast: false
         matrix:
            distro:
               - name: Debian 12 (Bookworm)
                 image: debian:12
                 setup: 'apt-get update -qq && apt-get install -y -qq curl unzip'
               - name: Debian 11 (Bullseye)
                 image: debian:11
                 setup: 'apt-get update -qq && apt-get install -y -qq curl unzip'
               - name: Ubuntu 24.04
                 image: ubuntu:24.04
                 setup: 'apt-get update -qq && apt-get install -y -qq curl unzip'
               - name: Ubuntu 22.04
                 image: ubuntu:22.04
                 setup: 'apt-get update -qq && apt-get install -y -qq curl unzip'
               - name: Ubuntu 20.04
                 image: ubuntu:20.04
                 setup: 'apt-get update -qq && apt-get install -y -qq curl unzip'
               - name: Fedora Latest
                 image: fedora:latest
                 setup: 'dnf install -y -q curl unzip'
               - name: Amazon Linux 2023
                 image: amazonlinux:2023
                 setup: 'yum install -y -q gzip unzip'

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Test on ${{ matrix.distro.name }}
           run: |
              set -e

              echo "Testing on ${{ matrix.distro.name }}..."

              # Create test script
              cat > test-container.sh << 'EOF'
              set -e

              # Setup if needed
              SETUP="${{ matrix.distro.setup }}"
              if [ -n "$SETUP" ]; then
                echo "Running setup commands..."
                eval "$SETUP" > /dev/null 2>&1
              fi

              # Install Bun first (required for new install script)
              echo "Installing Bun..."
              curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
              export PATH="$HOME/.bun/bin:$PATH"

              # Verify bun is installed
              bun --version

              # Run install script
              if ! ./install.sh -y > /tmp/install.log 2>&1; then
                echo "❌ Install failed:"
                cat /tmp/install.log
                exit 1
              fi

              # Verify CLI is installed
              if [ ! -f "$HOME/.bun/bin/agentuity" ]; then
                echo "❌ CLI not found at $HOME/.bun/bin/agentuity"
                ls -la "$HOME/.bun/bin/" || true
                exit 1
              fi

              # Test CLI execution
              if ! "$HOME/.bun/bin/agentuity" --version > /tmp/version.log 2>&1; then
                echo "❌ CLI execution failed:"
                cat /tmp/version.log
                exit 1
              fi

              version=$("$HOME/.bun/bin/agentuity" --version)
              echo "✅ SUCCESS: agentuity version $version"
              EOF

              chmod +x test-container.sh

              # Run test in container with CI env var
              if docker run --rm -e CI=true -v "$PWD:/app" -w /app ${{ matrix.distro.image }} sh -c './test-container.sh'; then
                echo "✅ ${{ matrix.distro.name }} test passed"
              else
                echo "❌ ${{ matrix.distro.name }} test failed"
                exit 1
              fi

   # Test Bun version checking
   test-bun-checks:
      name: Test Bun Version Checks
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Run Bun version check tests
           run: |
              chmod +x scripts/test-bun-check.sh
              ./scripts/test-bun-check.sh

   # Test specific scenarios
   test-scenarios:
      name: Test ${{ matrix.scenario.name }}
      runs-on: ubuntu-latest
      timeout-minutes: 10
      strategy:
         fail-fast: false
         matrix:
            scenario:
               - name: Force reinstall
                 test: |
                    docker run --rm -e CI=true -v "$PWD:/app" -w /app ubuntu:latest sh -c '
                      apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
                      
                      # Install Bun
                      curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
                      export PATH="$HOME/.bun/bin:$PATH"
                      
                      # First install
                      ./install.sh -y > /dev/null 2>&1
                      first_version=$($HOME/.bun/bin/agentuity --version)
                      
                      # Force reinstall
                      ./install.sh -y --force > /dev/null 2>&1
                      second_version=$($HOME/.bun/bin/agentuity --version)
                      
                      echo "First version: $first_version"
                      echo "Second version: $second_version"
                      echo "✅ Force reinstall completed"
                    '

               - name: Non-interactive with CI env
                 test: |
                    docker run --rm -e CI=true -v "$PWD:/app" -w /app ubuntu:latest sh -c '
                      apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
                      
                      # Install Bun
                      curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
                      export PATH="$HOME/.bun/bin:$PATH"
                      
                      # Install without -y flag (should still work in CI)
                      ./install.sh > /tmp/install.log 2>&1
                      
                      if [ ! -f "$HOME/.bun/bin/agentuity" ]; then
                        echo "❌ CLI not installed"
                        cat /tmp/install.log
                        exit 1
                      fi
                      
                      $HOME/.bun/bin/agentuity --version
                      echo "✅ Non-interactive install passed"
                    '

               - name: Upgrade command available
                 test: |
                    docker run --rm -e CI=true -v "$PWD:/app" -w /app ubuntu:latest sh -c '
                      apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
                      
                      # Install Bun
                      curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
                      export PATH="$HOME/.bun/bin:$PATH"
                      
                      # Install CLI
                      ./install.sh -y > /dev/null 2>&1
                      
                      # Check upgrade command exists by looking for it in --help output
                      $HOME/.bun/bin/agentuity --help > /tmp/help.log 2>&1 || true
                      
                      if ! grep -q "upgrade" /tmp/help.log; then
                        echo "⚠  Upgrade command not found (expected until new version is published)"
                        echo "✅ Test passed (pre-release state)"
                        exit 0
                      fi
                      
                      # Verify upgrade --help works
                      $HOME/.bun/bin/agentuity upgrade --help > /tmp/upgrade-help.log 2>&1 || true
                      
                      if ! grep -q "Upgrade the CLI to the latest version" /tmp/upgrade-help.log; then
                        echo "❌ Upgrade help missing expected text"
                        cat /tmp/upgrade-help.log
                        exit 1
                      fi
                      
                      echo "✅ Upgrade command exists"
                    '

               - name: Legacy shim creation
                 test: |
                    docker run --rm -e CI=true -v "$PWD:/app" -w /app ubuntu:latest sh -c '
                      apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
                      
                      # Install Bun
                      curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
                      export PATH="$HOME/.bun/bin:$PATH"
                      
                      # Create legacy directory and add to PATH to trigger shim creation
                      # The install script only creates the shim if ~/.agentuity/bin is on PATH
                      mkdir -p "$HOME/.agentuity/bin"
                      touch "$HOME/.agentuity/bin/agentuity"
                      export PATH="$HOME/.agentuity/bin:$PATH"
                      
                      # Install CLI
                      ./install.sh -y > /dev/null 2>&1
                      
                      # Verify shim was created
                      if [ ! -f "$HOME/.agentuity/bin/agentuity" ]; then
                        echo "❌ Legacy shim not created"
                        exit 1
                      fi
                      
                      # Verify shim works
                      if ! "$HOME/.agentuity/bin/agentuity" --version > /dev/null 2>&1; then
                        echo "❌ Legacy shim does not work"
                        exit 1
                      fi
                      
                      echo "✅ Legacy shim created and works"
                    '

               - name: Legacy shim cleanup when not on PATH
                 test: |
                    docker run --rm -e CI=true -v "$PWD:/app" -w /app ubuntu:latest sh -c '
                      apt-get update -qq && apt-get install -y -qq curl unzip > /dev/null 2>&1
                      
                      # Install Bun
                      curl -fsSL https://bun.sh/install | bash > /dev/null 2>&1
                      export PATH="$HOME/.bun/bin:$PATH"
                      
                      # Create legacy directory but do NOT add to PATH
                      # The install script should clean this up
                      mkdir -p "$HOME/.agentuity/bin"
                      touch "$HOME/.agentuity/bin/agentuity"
                      
                      # Install CLI
                      ./install.sh -y > /dev/null 2>&1
                      
                      # Verify legacy binary was removed (since not on PATH)
                      if [ -f "$HOME/.agentuity/bin/agentuity" ]; then
                        echo "❌ Legacy binary should have been cleaned up (not on PATH)"
                        exit 1
                      fi
                      
                      # Verify main CLI still works
                      if ! "$HOME/.bun/bin/agentuity" --version > /dev/null 2>&1; then
                        echo "❌ Main CLI does not work"
                        exit 1
                      fi
                      
                      echo "✅ Legacy cleanup works correctly"
                    '

      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Test ${{ matrix.scenario.name }}
           run: |
              set -e
              echo "Testing: ${{ matrix.scenario.name }}"
              ${{ matrix.scenario.test }}
              echo "✅ ${{ matrix.scenario.name }} passed"

   # Summary job
   test-summary:
      name: Test Summary
      runs-on: ubuntu-latest
      needs: [test-native, test-linux-distros, test-bun-checks, test-scenarios]
      if: always()
      steps:
         - name: Check results
           run: |
              if [ "${{ needs.test-native.result }}" != "success" ] || \
                 [ "${{ needs.test-linux-distros.result }}" != "success" ] || \
                 [ "${{ needs.test-bun-checks.result }}" != "success" ] || \
                 [ "${{ needs.test-scenarios.result }}" != "success" ]; then
                echo "❌ Some tests failed"
                exit 1
              fi
              echo "✅ All tests passed!"
