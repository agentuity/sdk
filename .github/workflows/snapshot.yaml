name: Build Sandbox Snapshot

on:
   release:
      types: [published]
   workflow_dispatch:
      inputs:
         version:
            description: 'Version for snapshot metadata (e.g., 1.0.0)'
            required: false
            default: 'dev'

env:
   CI: true
   AGENTUITY_API_URL: https://api-v1.agentuity.com
   AGENTUITY_APP_URL: https://app-v1.agentuity.com

jobs:
   build-snapshot:
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 15
      name: Build Sandbox Snapshot
      env:
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install Agentuity CLI
           run: curl -fsSL https://v1.agentuity.sh | sh

         - name: Generate CLI Auth Token
           run: |
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Create Demo Project
           run: |
              TMP_DIR=$(mktemp -d)
              echo "TMP_DIR=${TMP_DIR}" >> $GITHUB_ENV
              agentuity project create --template default --dir "$TMP_DIR" --no-register

         - name: Build Snapshot
           run: |
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                VERSION="${{ inputs.version }}"
              else
                VERSION="${GITHUB_REF_NAME#v}"
              fi
              agentuity cloud sandbox snapshot build --metadata VERSION="$VERSION" -f agentuity-snapshot.yaml "$TMP_DIR"
