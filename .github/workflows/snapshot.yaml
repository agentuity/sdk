name: Build Sandbox Snapshots

on:
   release:
      types: [published]
   push:
      branches:
         - main
      paths:
         - snapshots/**
   workflow_dispatch:
      inputs:
         version:
            description: 'Version for snapshot metadata (e.g., 1.0.0)'
            required: false
            default: 'dev'

env:
   CI: true
   AGENTUITY_API_URL: https://api.agentuity.com
   AGENTUITY_APP_URL: https://app.agentuity.com
   AGENTUITY_ORG_ID: org_2u8RgDTwcZWrZrZ3sZh24T5FCtz
   AGENTUITY_REGION: usc

jobs:
   build-demo-project-snapshot:
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 15
      name: Build Demo Project Snapshot
      env:
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install Agentuity CLI
           run: curl -fsSL https://agentuity.sh | sh

         - name: Generate CLI Auth Token
           run: |
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Create Demo Project
           run: |
              TMP_DIR=$(mktemp -d)
              echo "TMP_DIR=${TMP_DIR}" >> $GITHUB_ENV
              agentuity project create --template default --name demo-project --dir "$TMP_DIR" --no-register

         - name: Build Snapshot
           run: |
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                VERSION="${{ inputs.version }}"
              elif [ "${{ github.event_name }}" = "release" ]; then
                VERSION="${GITHUB_REF_NAME#v}"
              else
                VERSION="dev"
              fi
              agentuity cloud sandbox snapshot build --org-id $AGENTUITY_ORG_ID --confirm --metadata VERSION="$VERSION" --file snapshots/agentuity-demo-project/agentuity-snapshot.yaml "$TMP_DIR"

   build-sdk-explorer-snapshot:
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 15
      name: Build SDK Explorer Snapshot
      env:
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install Agentuity CLI
           run: curl -fsSL https://agentuity.sh | sh

         - name: Generate CLI Auth Token
           run: |
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Install Dependencies
           run: bun install

         - name: Build Packages
           run: bun run build

         - name: Bundle Run Scripts
           working-directory: apps/docs
           run: bun run scripts/bundle-run-scripts.ts

         - name: Build Snapshot
           working-directory: apps/docs
           run: |
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                VERSION="${{ inputs.version }}"
              elif [ "${{ github.event_name }}" = "release" ]; then
                VERSION="${GITHUB_REF_NAME#v}"
              else
                VERSION="dev"
              fi
              agentuity cloud sandbox snapshot build --org-id $AGENTUITY_ORG_ID --confirm --metadata VERSION="$VERSION" --file ../../snapshots/sdk-explorer/agentuity-snapshot.yaml .

   build-github-deploy-snapshot:
      runs-on: blacksmith-2vcpu-ubuntu-2204
      timeout-minutes: 10
      name: Build GitHub Deploy Snapshot
      env:
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
      steps:
         - uses: actions/checkout@v4

         - name: Install Agentuity CLI
           run: curl -fsSL https://agentuity.sh | sh

         - name: Generate CLI Auth Token
           run: |
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Build Snapshot
           run: |
              agentuity cloud sandbox snapshot build --org-id $AGENTUITY_ORG_ID --confirm snapshots/github-deploy-build
