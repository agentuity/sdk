name: Full Docs Sync to Vector Store

on:
   workflow_dispatch:

permissions:
   contents: read

env:
   GITHUB_TOKEN: ''

jobs:
   full-sync:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
           with:
              persist-credentials: false

         - name: Collect all files
           run: |
              set -euo pipefail
              ./docs/bin/collect-all-files.sh > all-files.txt

              echo "Files to sync:"
              cat all-files.txt

         - name: Send batched payload
           env:
              AGENT_BEARER_TOKEN: ${{ secrets.AGENT_BEARER_TOKEN }}
              DOCS_WEBHOOK_URL: ${{ secrets.DOCS_WEBHOOK_URL }}
              DOCS_SYNC_COMMIT: ${{ github.sha }}
              BATCH_SIZE: 5
           run: |
              set -euo pipefail
              cat all-files.txt | \
                ./docs/bin/send-batched.sh \
                  "${{ github.repository }}" \
                  full \
                  "$DOCS_WEBHOOK_URL" \
                  "Bearer $AGENT_BEARER_TOKEN"
