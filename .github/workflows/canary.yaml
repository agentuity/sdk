name: NPM Pack & Upload

on:
   push:
      branches:
         - main
   pull_request:

permissions:
   contents: read
   pull-requests: write

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   CI: true
   AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
   AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
   AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
   AWS_ENDPOINT_URL_IAM: ${{ vars.AWS_ENDPOINT_URL_IAM }}
   AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
   pack-and-upload:
      runs-on: blacksmith-4vcpu-ubuntu-2204
      timeout-minutes: 15
      name: Pack & Upload
      steps:
         - uses: actions/checkout@v4
           with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Pack and Upload
           id: pack
           run: bun scripts/canary.ts

         - name: Comment on PR
           if: github.event_name == 'pull_request'
           uses: actions/github-script@v7
           with:
              script: |
                 const version = '${{ steps.pack.outputs.prerelease_version }}';
                 const packagesJson = ${{ steps.pack.outputs.packages_json }};
                 const npmBaseUrl = `https://agentuity-sdk-objects.t3.storageapi.dev/npm/${version}`;

                 // Build packages table
                 let packagesTable = '| Package | Version | URL |\n| --- | --- | --- |\n';
                 for (const pkg of packagesJson) {
                   const url = `${npmBaseUrl}/${pkg.tarball}`;
                   packagesTable += `| \`${pkg.name}\` | \`${version}\` | ${url} |\n`;
                 }

                 // Build overrides object with all packages
                 const overrides = {};
                 for (const pkg of packagesJson) {
                   overrides[pkg.name] = `${npmBaseUrl}/${pkg.tarball}`;
                 }
                 const overridesJson = JSON.stringify({ overrides }, null, 2);

                 // Build agent prompt
                 const packageList = packagesJson.map(pkg => `- ${pkg.name}`).join('\n');
                 const agentPrompt = `Add canary overrides to root package.json and run bun install.

version: ${version}
base url: ${npmBaseUrl}
tarball pattern: {package-name-without-scope}-${version}.tgz

packages:
${packageList}`;

                 const body = `<!-- agentuity-canary-bot -->
                 ## 📦 Canary Packages Published
                 **version:** \`${version}\`

                 <details open>
                 <summary>Agent Prompt</summary>

                 \`\`\`
                 ${agentPrompt}
                 \`\`\`
                 </details>

                 <details>
                 <summary>Packages</summary>

                 ${packagesTable}
                 </details>

                 <details>
                 <summary>Install</summary>

                 Add to the \`overrides\` field in your \`package.json\`, then run \`bun install\`:

                 \`\`\`json
                 ${overridesJson}
                 \`\`\`
                 </details>
                 `;

                  // Find existing comment
                  const { data: comments } = await github.rest.issues.listComments({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                  });

                  const botComment = comments.find(c =>
                    c.body && c.body.includes('<!-- agentuity-canary-bot -->')
                  );

                  if (botComment) {
                    await github.rest.issues.updateComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      comment_id: botComment.id,
                      body: body,
                    });
                  } else {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: context.issue.number,
                      body: body,
                    });
                  }
