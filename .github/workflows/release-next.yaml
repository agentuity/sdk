name: Release to npm (next)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for npm Trusted Publishers (OIDC)

concurrency:
  # Never cancel an in-flight release: a half-cancelled run can leave npm in a
  # partially-published state (some packages at the new version, others not).
  # New pushes to main will queue and run after the current release finishes.
  group: release-next-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CI: true
  GITHUB_TOKEN: ''
  NODE_ENV: production
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    env:
      AGENTUITY_API_URL: https://api.agentuity.com
      AGENTUITY_APP_URL: https://app.agentuity.com
      AGENTUITY_TRANSPORT_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_CATALYST_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_STREAM_URL: https://streams-usc.agentuity.cloud
      AGENTUITY_KEYVALUE_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_OBJECTSTORE_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_VECTOR_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_LOG_LEVEL: info
      AGENTUITY_REGION: usc
      AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
           persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
           bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup test credentials
        run: |
          set -euo pipefail
          APIKEY=$(curl --fail --silent --show-error \
            "$AGENTUITY_API_URL/cli/auth/short-token" \
            -H 'Content-Type: application/json' \
            --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" \
            | jq -er '.data.apiKey')
          echo "::add-mask::${APIKEY}"
          echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> "$GITHUB_ENV"

      - name: Build
        run: bun run build

      - name: Format check
        run: bun format

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Unit tests
        env:
          NODE_ENV: test
        run: bun run test:unit

      # The CLI's compiled dist/bin/cli.js ships with a #!/usr/bin/env
      # node shebang and must run under Node 24+. Smoke this
      # end-to-end so a regression that re-introduces a Bun-only API
      # gets caught before publish.
      - name: Setup Node.js for CLI smoke test
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: CLI smoke test under Node
        run: |
          set -euo pipefail
          cd packages/cli
          node ./dist/bin/cli.js --version
          node ./dist/bin/cli.js --help > /dev/null

  release:
    name: Release to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: build-and-test
    # Only run for pushes to main (next tag)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
           persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
           bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Node.js for npm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Build packages
        run: bun run build

      - name: Publish packages
        run: |
          set -euo pipefail

          # Packages in dependency order (core first)
          PACKAGES=(
            "packages/core"
            "packages/postgres"
            "packages/claude-code"
            "packages/coder"
            "packages/coder-tui"
            "packages/schema"
            "packages/server"
            "packages/queue"
            "packages/vector"
            "packages/migrate"
            "packages/opencode"
            "packages/runtime"
            "packages/drizzle"
            "packages/schedule"
            "packages/sandbox"
            "packages/task"
            "packages/webhook"
            "packages/keyvalue"
            "packages/email"
            "packages/storage"
            "packages/cli"
            "packages/db"
          )

          for pkg_path in "${PACKAGES[@]}"; do
            pkg_name=$(jq -r .name "$pkg_path/package.json")
            pkg_version=$(jq -r .version "$pkg_path/package.json")

            echo "Publishing $pkg_name@$pkg_version with tag 'next'..."

            # Check if version already exists
            if npm view "$pkg_name@$pkg_version" version 2>/dev/null; then
              echo "  Version already published, skipping"
              continue
            fi

            (cd "$pkg_path" && npm publish --tag next --access public)
          done

      - name: Summary
        run: |
          VERSION=$(jq -r .version package.json)
          {
            echo "## 📦 Released to npm"
            echo ""
            echo "**Version:** \`$VERSION\`"
            echo "**Tag:** \`next\`"
            echo ""
            echo "Install with:"
            echo "\`\`\`bash"
            echo "npm install @agentuity/core@next"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

