# yaml-language-server: $schema=https://agentuity.dev/schema/cli/v1/agentuity-snapshot.json
# SDK Explorer Snapshot (v3) - pre-bundled standalone run scripts (no node_modules needed)
# v2 docs build their own snapshot named sdk-explorer-v2 on the v2 branch.

version: 1
runtime: agentuity:latest
name: sdk-explorer-v3
description: SDK Explorer (v3) with pre-bundled standalone run scripts
# The docs API creates sandboxes with an org-scoped key and explicit orgId.
public: false
dir: docs

files:
   - dist/run/**

metadata:
   project: sdk-docs
   version: ${VERSION}
