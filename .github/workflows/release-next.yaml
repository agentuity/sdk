name: Release to npm (next)

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write # Required for npm provenance

concurrency:
  group: release-next-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CI: true
  NODE_ENV: production

jobs:
  build-and-test:
    name: Build & Test
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    env:
      AGENTUITY_API_URL: https://api.agentuity.com
      AGENTUITY_APP_URL: https://app.agentuity.com
      AGENTUITY_TRANSPORT_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_CATALYST_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_STREAM_URL: https://streams-usc.agentuity.cloud
      AGENTUITY_KEYVALUE_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_OBJECTSTORE_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_VECTOR_URL: https://catalyst-usc.agentuity.cloud
      AGENTUITY_LOG_LEVEL: info
      AGENTUITY_REGION: usc
      AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Setup test credentials
        run: |
          APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
          echo "::add-mask::${APIKEY}"
          echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

      - name: Build
        run: bun run build

      - name: Format check
        run: bun format

      - name: Lint
        run: bun lint

      - name: Typecheck
        run: bun typecheck

      - name: Unit tests
        run: bun run test:unit

  release:
    name: Release to npm
    runs-on: blacksmith-4vcpu-ubuntu-2204
    timeout-minutes: 15
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Build packages
        run: bun run build:packages

      - name: Publish packages
        run: |
          set -eou pipefail

          VERSION=$(jq -r .version package.json)

          # Packages in dependency order (core first)
          PACKAGES=(
            "packages/core"
            "packages/postgres"
            "packages/claude-code"
            "packages/coder"
            "packages/frontend"
            "packages/schema"
            "packages/server"
            "packages/queue"
            "packages/vector"
            "packages/migrate"
            "packages/opencode"
            "packages/runtime"
            "packages/drizzle"
            "packages/schedule"
            "packages/sandbox"
            "packages/task"
            "packages/auth"
            "packages/evals"
            "packages/webhook"
            "packages/keyvalue"
            "packages/email"
            "packages/react"
            "packages/cli"
            "packages/workbench"
            "packages/db"
          )

          for pkg_path in "${PACKAGES[@]}"; do
            pkg_name=$(jq -r .name "$pkg_path/package.json")
            pkg_version=$(jq -r .version "$pkg_path/package.json")

            echo "Publishing $pkg_name@$pkg_version with tag 'next'..."

            # Check if version already exists
            if npm view "$pkg_name@$pkg_version" version 2>/dev/null; then
              echo "  Version already published, updating dist-tag..."
              npm dist-tag add "$pkg_name@$pkg_version" next
            else
              (cd "$pkg_path" && npm publish --tag next --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          VERSION=$(jq -r .version package.json)
          echo "## 📦 Released to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`next\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Install with:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install @agentuity/core@next" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY