name: Package Smoke Test

on:
   push:
      branches:
         - main
         - v2
   pull_request:

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

env:
   CI: true

jobs:
   smoke-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 15
      name: Package Installation & Usage Test
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Run package smoke test
           run: bash scripts/test-package-install.sh

   postgres-ssl-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Postgres SSL Integration Test
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Verify Docker availability
           run: docker --version

         - name: Run Postgres SSL integration tests
           run: bash packages/postgres/test-postgres.sh

   installation-type-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 5
      name: Installation Type Detection Test
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Run installation type detection tests
           run: bash packages/cli/scripts/test-installation-type.sh

   testing-apps-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Testing Apps (local tests)
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Run standalone-backend tests
           run: cd apps/testing/standalone-backend && bun test

         - name: Run oauth tests
           run: cd apps/testing/oauth && bun test

         - name: Run e2e-web tests
           run: cd apps/testing/e2e-web && bun test

         - name: Run integration-suite tests
           run: cd apps/testing/integration-suite && bun test

   template-integration-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 30
      name: Template Integration Tests
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Run template integration tests
           run: bun scripts/test-templates.ts --skip-outdated

   sandbox-cli-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Sandbox CLI Tests
      env:
         AGENTUITY_API_URL: https://api.agentuity.com
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
         AGENTUITY_CLOUD_ORG_ID: ${{ vars.AGENTUITY_CLOUD_ORG_ID }}
         AGENTUITY_REGION: usc
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Setup test credentials
           run: |
              # Generate CLI API key for authentication
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Run sandbox CLI tests
           run: bash scripts/test-sandbox.sh

   storage-cli-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Storage CLI Tests
      env:
         AGENTUITY_API_URL: https://api.agentuity.com
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
         AGENTUITY_CLOUD_ORG_ID: ${{ vars.AGENTUITY_CLOUD_ORG_ID }}
         AGENTUITY_REGION: usc
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Setup test credentials
           run: |
              # Generate CLI API key for authentication
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Run storage CLI tests
           run: bun scripts/test-storage.ts

   queue-sdk-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Queue SDK Tests
      env:
         AGENTUITY_API_URL: https://api.agentuity.com
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
         AGENTUITY_CLOUD_ORG_ID: ${{ vars.AGENTUITY_CLOUD_ORG_ID }}
         AGENTUITY_REGION: usc
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Setup test credentials
           run: |
              # Set SDK key for queue operations
              echo "AGENTUITY_SDK_KEY=${{ secrets.INTEGRATION_SUITE_AGENTUITY_SDK_KEY }}" >> $GITHUB_ENV

         - name: Run queue SDK tests
           run: bash scripts/test-queues.sh

   queue-cli-test:
      runs-on: blacksmith-2vcpu-ubuntu-2404
      timeout-minutes: 10
      name: Queue CLI Tests
      env:
         AGENTUITY_API_URL: https://api.agentuity.com
         AGENTUITY_USER_ID: ${{ vars.AGENTUITY_USER_ID }}
         AGENTUITY_CLOUD_ORG_ID: ${{ vars.AGENTUITY_CLOUD_ORG_ID }}
         AGENTUITY_REGION: usc
      steps:
         - uses: actions/checkout@v4

         - name: Setup Bun
           uses: oven-sh/setup-bun@v2

         - name: Install dependencies
           run: bun install

         - name: Build packages
           run: bun run build

         - name: Setup test credentials
           run: |
              # Generate CLI API key for authentication
              APIKEY=$(curl $AGENTUITY_API_URL/cli/auth/short-token -H 'Content-Type: application/json' --data "{\"secret\":\"${{ secrets.AGENTUITY_APITOKEN_SHARED_SECRET }}\",\"userId\":\"${{ env.AGENTUITY_USER_ID }}\"}" | jq -r '.data.apiKey')
              echo "::add-mask::${APIKEY}"
              echo "AGENTUITY_CLI_API_KEY=${APIKEY}" >> $GITHUB_ENV

         - name: Run queue CLI tests
           run: bash scripts/test-queue.sh

   # TODO: Re-enable Playwright E2E tests once apps have proper UI to test
   # playwright-e2e-test:

   # TODO: Re-enable framework demo tests once backend supports launch.json deploys
   # framework-demo-test:
